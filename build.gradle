plugins {
    // 자바 프로젝트임을 알려주는 기본 플러그인
    id 'java'
    // Spring Boot 플러그인: 실행 가능한 jar 빌드, 내장 톰캣, bootRun 태스크 등을 제공
    id 'org.springframework.boot' version '3.4.1'
    // 스프링이 관리하는 라이브러리들의 "버전"을 자동으로 맞춰주는 플러그인
    // (아래 dependencies에서 버전 번호를 대부분 안 적는 이유가 이것 때문)
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    // 자바 17로 컴파일/실행 (설치된 JDK와 일치)
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        // Lombok을 compileOnly + annotationProcessor 두 곳에 걸기 위한 설정
        extendsFrom annotationProcessor
    }
}

repositories {
    // 라이브러리를 내려받는 중앙 저장소 (npm의 npm registry에 해당)
    mavenCentral()
}

dependencies {
    // [Spring Web] REST API/컨트롤러 + 내장 톰캣. Express에 해당하는 웹 계층.
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // [Spring Data JPA] ORM(Hibernate) + Repository. Node의 Prisma/TypeORM에 해당.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // [Validation] @NotNull, @Email 같은 요청 값 검증 어노테이션 제공.
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // [Lombok] getter/생성자 등 반복 코드를 어노테이션으로 자동 생성.
    //  - compileOnly: 컴파일할 때만 필요 (최종 jar에는 안 들어감)
    //  - annotationProcessor: 컴파일 시점에 실제 코드를 생성하는 처리기
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // [MySQL Driver] 앱이 MySQL과 통신하기 위한 JDBC 드라이버. 실행 시에만 필요.
    runtimeOnly 'com.mysql:mysql-connector-j'

    // [H2] 메모리 DB. 테스트 실행 시에만 사용 (빠르고 격리됨).
    testRuntimeOnly 'com.h2database:h2'

    // [Test] JUnit5 + Spring Test 등 테스트 도구 묶음.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    // JUnit5(플랫폼) 방식으로 테스트 실행
    useJUnitPlatform()
}
